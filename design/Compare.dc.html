<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    .ng { font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Space Mono', ui-monospace, monospace; }
    a { color: #0a0a0a; }
    a:hover { color: #6b6b6b; }
    .row-label { font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#9a9a9a; }
    .row-val { margin-top:8px; font-size:19px; letter-spacing:-0.01em; color:#0a0a0a; }
  </style>
</helmet>

<div class="ng" style="width:1200px; min-height:820px; background:#ffffff; color:#0a0a0a; padding:52px 72px; position:relative;">

  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div style="font-size:18px; font-weight:700; letter-spacing:-0.02em;">NameGenius</div>
    <div style="font-size:14px; color:#6b6b6b;">&larr; Back</div>
  </div>

  <h1 style="margin:44px 0 0; font-size:52px; line-height:1.0; font-weight:800; letter-spacing:-0.04em;">Compare</h1>

  <!-- two-column typographic comparison -->
  <div style="margin-top:40px; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); border-top:1.5px solid #0a0a0a;">

    <!-- column A -->
    <div style="padding:34px 40px 34px 0; border-right:1px solid #e4e4e4;">
      <div style="font-size:34px; font-weight:700; letter-spacing:-0.03em;">BrightMind</div>
      <div class="mono" style="margin-top:8px; font-size:16px; color:#6b6b6b;">brightmind.io</div>

      <div style="margin-top:34px; display:flex; flex-direction:column; gap:26px;">
        <div>
          <div class="row-label">Domain</div>
          <div class="row-val mono">brightmind.io</div>
        </div>
        <div>
          <div class="row-label">Available on</div>
          <div class="row-val mono">.io &nbsp; .co</div>
        </div>
        <div>
          <div class="row-label">Length</div>
          <div class="row-val">10 characters</div>
        </div>
        <div>
          <div class="row-label">Style</div>
          <div class="row-val">Catchy</div>
        </div>
      </div>
    </div>

    <!-- column B -->
    <div style="padding:34px 0 34px 40px;">
      <div style="font-size:34px; font-weight:700; letter-spacing:-0.03em;">Velocity Labs</div>
      <div class="mono" style="margin-top:8px; font-size:16px; color:#6b6b6b;">velocitylabs.com</div>

      <div style="margin-top:34px; display:flex; flex-direction:column; gap:26px;">
        <div>
          <div class="row-label">Domain</div>
          <div class="row-val mono">velocitylabs.com</div>
        </div>
        <div>
          <div class="row-label">Available on</div>
          <div class="row-val mono">.com &nbsp; .io</div>
        </div>
        <div>
          <div class="row-label">Length</div>
          <div class="row-val">12 characters</div>
        </div>
        <div>
          <div class="row-label">Style</div>
          <div class="row-val">Descriptive</div>
        </div>
      </div>
    </div>

  </div>

  <div style="margin-top:36px;">
    <a href="#" style="font-size:14px; color:#6b6b6b; text-decoration:underline; text-underline-offset:4px; text-decoration-color:#c9c9c9;">Clear selection</a>
  </div>
</div>
</x-dc>
</body>
</html>
