<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Comic Sans MS', 'Segoe Print', cursive, sans-serif; background: #fafaf8; color: #222; }
    a { color: #222; } a:hover { color: #555; }
    .dash { border: 2px dashed #888; }
  </style>
</helmet>
<div style="width: 1120px; min-height: 760px; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column; gap: 32px;">

  <div style="display:flex; flex-direction:column; gap:6px; align-items:center; text-align:center;">
    <div style="font-size:34px; font-weight:700; letter-spacing:0.5px;">NameGenius</div>
    <div style="font-size:15px; color:#666;">Type a keyword. Get 10 business names. See which .com's are free.</div>
    <div style="font-size:11px; color:#999; margin-top:2px;">Built for solo founders in India</div>
  </div>

  <div class="dash" style="display:flex; gap:12px; padding:18px; border-radius:4px;">
    <div class="dash" style="flex-grow:1; padding:12px 14px; font-size:15px; color:#222; border-radius:3px; background:#fff;">sustainable fashion</div>
    <div style="background:#222; color:#fff; padding:12px 26px; font-size:15px; border-radius:3px; white-space:nowrap; display:flex; align-items:center;">Generate Names</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:10px;">
    <div style="font-size:13px; color:#888;">Results for "sustainable fashion"</div>
    <div style="display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:16px;">
      <sc-for list="{{names}}" as="n" hint-placeholder-count="10">
        <div class="dash" style="border-radius:6px; padding:18px 14px; display:flex; flex-direction:column; gap:10px; background:#fff;">
          <div style="font-size:16px; font-weight:600;">{{n.name}}</div>
          <div style="font-size:12px; color:#888;">{{n.domain}}</div>
          <sc-if value="{{n.available}}" hint-placeholder-val="{{true}}">
            <div style="align-self:flex-start; font-size:11px; padding:4px 10px; border-radius:12px; background:#e6f4ea; color:#1e7d34; border:1px solid #b7e0c3;">Available</div>
          </sc-if>
          <sc-if value="{{n.taken}}" hint-placeholder-val="{{true}}">
            <div style="align-self:flex-start; font-size:11px; padding:4px 10px; border-radius:12px; background:#fbe9e7; color:#b3261e; border:1px solid #f2c2bd;">Taken</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="font-size:11px; color:#bbb; text-align:center; margin-top:auto; padding-top:20px;">wireframe — state 3 of 3: results (10 cards, name + .com status only)</div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ["EcoThread", true], ["GreenSeam", false], ["ReWeave Co", true], ["PureFiber", false],
      ["Sustyle", true], ["ThreadCircle", true], ["EarthWear Studio", false], ["LoopFabric", true],
      ["Kindstitch", true], ["Verdant Wear", false]
    ];
    const names = raw.map(([name, available]) => ({
      name,
      domain: name.toLowerCase().replace(/[^a-z0-9]/g, '') + '.com',
      available,
      taken: !available
    }));
    return { names };
  }
}
</script>
</body>
</html>
